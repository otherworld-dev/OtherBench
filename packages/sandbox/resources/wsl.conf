# OtherBench's sandbox distro (spec 2026-10-12-sandbox-design, "Backend (Windows)").
# No Windows drives unless OtherBench mounts a chat's folder, no Windows programs,
# no Windows PATH, and no systemd (it makes `wsl -u root` print errors).
[automount]
enabled=false
mountFsTab=false

[interop]
enabled=false
appendWindowsPath=false

[user]
default=otherbench

[boot]
systemd=false
