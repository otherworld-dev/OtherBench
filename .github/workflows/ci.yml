name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install --only-shell chromium
      - run: npm run typecheck
      # Tests are outside `tsc -b` (it builds src only); this checks them too.
      # TODO: 101 type errors in 24 test files predate this step; remove
      # continue-on-error once they are fixed (see docs/HANDOVER.md, Integration).
      - run: npm run typecheck:tests
        continue-on-error: true
      - run: npm test

  # Betas on every green push of dev, full releases on vX.Y.Z tags: the
  # installer, its updater signature and latest.json, published as a GitHub
  # release (desktop/scripts/release/publish.mjs). Installed apps update from
  # these (desktop/src-tauri/src/update.rs).
  release:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      # A newer push to dev makes a beta still building pointless; a tag's build always finishes.
      cancel-in-progress: ${{ github.ref == 'refs/heads/dev' }}
    # Each secret goes only to the step that needs it, so install scripts and
    # build scripts in the other steps never see one.
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: 'npm' }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { workspaces: desktop/src-tauri }
      - run: npm ci
      - run: cargo test --manifest-path desktop/src-tauri/Cargo.toml
      - run: node desktop/scripts/release/publish.mjs version
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run app:release -w @otherbench/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - run: node desktop/scripts/release/publish.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
