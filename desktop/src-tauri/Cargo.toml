[package]
name = "otherbench-desktop"
version = "0.1.0"
description = "OtherBench desktop shell"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
tauri-plugin-opener = "2"
# Computer use: screenshots as PNG, sent as base64 (src/computer). Both already in the tree.
png = "0.18"
base64 = "0.22"
tauri-plugin-window-state = "2"
# Updates from GitHub releases (src/update.rs). semver is already in the tree through Tauri.
tauri-plugin-updater = "2"
semver = "1"
# A deadline on the update download (update.rs `within`); tokio is Tauri's runtime already.
tokio = { version = "1", features = ["time"] }

[target.'cfg(windows)'.dependencies]
# Windows toasts with a click handler (notify.rs); already in the tree via the notification plugin.
tauri-winrt-notification = "0.8"
# Computer use (src/computer/win.rs). Already in the tree through Tauri; these features only switch modules on.
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Catalog",
  "Win32_Security_Cryptography_Sip",
  "Win32_Security_WinTrust",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
